<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">卷积层共享参数的梯度累加</title>
  <desc id="desc">同一个卷积核参数在多个空间位置被使用，总梯度等于每个位置产生的梯度贡献求和。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f69"/>
    </marker>
    <style>
      .bg{fill:#fbfcfd}.panel{fill:#fff;stroke:#c8d9df;stroke-width:2}
      .grid{fill:#fff;stroke:#b8cbd2;stroke-width:2}.cell{fill:#eef7f8;stroke:#b8cbd2;stroke-width:1.4}
      .kernel{fill:#fff7ea;stroke:#d89b42;stroke-width:3}.out{fill:#f4f0ff;stroke:#8d79c6;stroke-width:2}
      .arrow{stroke:#315f69;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#203038;font-size:21px}
      .small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#53656d;font-size:16px}
      .formula{font-family:"Times New Roman",serif;fill:#1f2d33;font-size:24px}
      .sub,.sup{font-size:65%}
      .sub{baseline-shift:sub}.sup{baseline-shift:super}
    </style>
  </defs>
  <rect class="bg" width="960" height="430"/>
  <rect class="panel" x="28" y="28" width="904" height="374" rx="10"/>
  <text class="text" x="54" y="72">卷积核参数共享：同一个 w 在多个位置贡献梯度</text>

  <text class="small" x="72" y="112">输入特征图</text>
  <g transform="translate(72 130)">
    <rect class="grid" x="0" y="0" width="220" height="220"/>
    <g>
      <rect class="cell" x="0" y="0" width="55" height="55"/><rect class="cell" x="55" y="0" width="55" height="55"/><rect class="cell" x="110" y="0" width="55" height="55"/><rect class="cell" x="165" y="0" width="55" height="55"/>
      <rect class="cell" x="0" y="55" width="55" height="55"/><rect class="cell" x="55" y="55" width="55" height="55"/><rect class="cell" x="110" y="55" width="55" height="55"/><rect class="cell" x="165" y="55" width="55" height="55"/>
      <rect class="cell" x="0" y="110" width="55" height="55"/><rect class="cell" x="55" y="110" width="55" height="55"/><rect class="cell" x="110" y="110" width="55" height="55"/><rect class="cell" x="165" y="110" width="55" height="55"/>
      <rect class="cell" x="0" y="165" width="55" height="55"/><rect class="cell" x="55" y="165" width="55" height="55"/><rect class="cell" x="110" y="165" width="55" height="55"/><rect class="cell" x="165" y="165" width="55" height="55"/>
    </g>
    <rect class="kernel" x="0" y="0" width="110" height="110"/>
    <rect class="kernel" x="55" y="55" width="110" height="110" opacity=".78"/>
    <rect class="kernel" x="110" y="110" width="110" height="110" opacity=".55"/>
  </g>

  <path class="arrow" d="M320 240 L438 240"/>
  <rect class="kernel" x="458" y="162" width="112" height="112" rx="8"/>
  <line x1="514" y1="162" x2="514" y2="274" stroke="#d89b42" stroke-width="2"/>
  <line x1="458" y1="218" x2="570" y2="218" stroke="#d89b42" stroke-width="2"/>
  <text class="formula" x="500" y="227">w</text>
  <text class="small" x="455" y="300">同一卷积核</text>

  <path class="arrow" d="M590 240 L700 240"/>
  <g transform="translate(720 150)">
    <rect class="out" x="0" y="0" width="130" height="130" rx="8"/>
    <line x1="65" y1="0" x2="65" y2="130" stroke="#8d79c6" stroke-width="2"/>
    <line x1="0" y1="65" x2="130" y2="65" stroke="#8d79c6" stroke-width="2"/>
    <text class="formula" x="20" y="40">c<tspan class="sub">1</tspan></text><text class="formula" x="84" y="40">c<tspan class="sub">2</tspan></text>
    <text class="formula" x="20" y="105">c<tspan class="sub">3</tspan></text><text class="formula" x="84" y="105">c<tspan class="sub">4</tspan></text>
  </g>
  <text class="small" x="728" y="305">各位置的贡献</text>

  <rect class="out" x="230" y="368" width="510" height="40" rx="8"/>
  <text class="formula" x="250" y="396">∂C/∂w = contribution<tspan class="sub">1</tspan> + contribution<tspan class="sub">2</tspan> + ... + contribution<tspan class="sub">k</tspan></text>
</svg>
