<body>
  <main class="wrap is-doc-viewer">
    <div id="topNav" class="top-nav"></div>

    <section class="layout">
      <aside id="sidebar" class="sidebar card"></aside>
      <article id="viewer" class="viewer card is-hidden">
        <p class="hint">请选择左侧文档进行预览。</p>
      </article>
    </section>
  </main>
  <button id="backTopBtn" class="back-top" type="button" aria-label="回到顶部">回到顶部</button>

  <script src="/immutable/vendor/marked.min.3e7e7d7feb3e5d58cb6c804f68ab5c24cc7e5eb6270fd6e5cbb9124739217d0c.js"></script>

  <script>
    initTopNav({
      containerEl: document.getElementById("topNav"),
      current: "docs",
    });

    initDocViewer({
      sidebarEl: document.getElementById("sidebar"),
      viewerEl: document.getElementById("viewer"),
      backTopBtnEl: document.getElementById("backTopBtn"),
      indexUrl: "./index.md",
      sidebarTitle: "文档索引",
      hideViewerByDefault: true,
      showRawLinkOnLoadError: true,
      showRawLinkOnIndexError: true,
      enableHistorySync: true,
      enableInDocFileLink: true,
      convertWikiLinks: true,
      titleCaseFallback: false,
      errorIncludeFile: false,
      emptyText: "index.md 中没有可展示条目。",
    });
  </script>
