<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
  <link rel="icon" href="/assets/icons/ally.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#263d36" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ally" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="/immutable/vendor/katex.min.b64fc29eccc9d1202f58804f89ed7a9d648fe8b292c14ada509cc834c3f5fea4.css" />
  <link rel="stylesheet" href="/immutable/assets/site/shell.fc7e695365bd3044e425db89858fed70d1fe55a0e29c6b261ad4191d1f89f42c.css" />
  <link rel="stylesheet" href="/immutable/assets/site/markdown.e243c0ed6f654093ef0d51954518b348e7f59bc1000fce1b67da850da4fc1af0.css" />
  <title>Docs Single View</title>
  <style>
    .single-wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .single-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .single-head-title {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .single-head-file {
      margin: 0;
      font-family: var(--mono);
      font-size: 12px;
      color: #334155;
      word-break: break-all;
    }

    .single-viewer {
      padding: 18px 20px;
    }

    .single-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .single-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      background: #fff;
    }

    .single-link:hover {
      background: var(--accent-soft);
    }

    @media (max-width: 720px) {
      .single-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .single-viewer {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="single-wrap">
    <section class="single-head">
      <div>
        <p class="single-head-title">Single Markdown View</p>
        <p id="fileLabel" class="single-head-file">-</p>
      </div>
      <div class="single-actions">
        <a id="rawLink" class="single-link" href="#" target="_blank" rel="noopener noreferrer">Open Raw</a>
      </div>
    </section>

    <article id="viewer" class="card single-viewer">
      <p class="hint">Loading...</p>
    </article>
  </main>

  <script src="/immutable/vendor/marked.min.3e7e7d7feb3e5d58cb6c804f68ab5c24cc7e5eb6270fd6e5cbb9124739217d0c.js"></script>
  <script src="/immutable/vendor/katex.min.e6bfe5deebd4c7ccd272055bab63bd3ab2c73b907b6e6a22d352740a81381fd4.js"></script>
  <script src="/immutable/vendor/katex-auto-render.min.7b57d427ac6270677daf8d8380ded2cc73336f9149a167b8e1fe0d6ef66604ae.js"></script>
  <script src="/immutable/assets/site/doc-viewer.db9fb725b5a8e50fa9961d5d537f6b0255bb59a03ec06fda8df17e9d0848919b.js"></script>
  <script>
    (function () {
      const viewerEl = document.getElementById("viewer");
      const fileLabelEl = document.getElementById("fileLabel");
      const rawLinkEl = document.getElementById("rawLink");

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function getFileFromQuery() {
        const params = new URLSearchParams(window.location.search);
        let file = (params.get("file") || "").trim();
        if (!file) return "";

        file = file.replace(/^\.\//, "");
        if (!file.endsWith(".md")) file += ".md";

        if (
          file.startsWith("/") ||
          file.includes("..") ||
          /^[a-zA-Z]+:\/\//.test(file)
        ) {
          return "";
        }
        return file;
      }

      function convertWikiLinks(md) {
        return String(md || "").replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (_, path, alias) {
          let target = String(path || "").trim();
          if (!target.endsWith(".md")) target += ".md";
          const label = String(alias || path || "").trim();
          return "[" + label + "](" + "./view.html?file=" + encodeURIComponent(target) + ")";
        });
      }

      const renderMarkdown = window.createDocRenderer(viewerEl, {
        convertWikiLinks: convertWikiLinks
      });

      async function load() {
        const file = getFileFromQuery();
        if (!file) {
          viewerEl.innerHTML = '<p class="hint">Missing or invalid file. Use <code>?file=xxx.md</code>.</p>';
          return;
        }

        fileLabelEl.textContent = file;
        rawLinkEl.href = "./" + file;

        try {
          const resp = await fetch("./" + file, { cache: "no-cache" });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const md = await resp.text();
          renderMarkdown(md);

          const firstHeading = viewerEl.querySelector(".markdown h1");
          if (firstHeading && firstHeading.textContent.trim()) {
            document.title = firstHeading.textContent.trim() + " - Docs";
          } else {
            document.title = file + " - Docs";
          }
        } catch (err) {
          viewerEl.innerHTML = '<p class="hint">Load failed: ' + escapeHtml((err && err.message) || String(err)) + "</p>";
        }
      }

      load();
    })();
  </script>
</body>
</html>
