</head>
<body>
  <main class="game">
    <header class="masthead">
      <a href="../index.html">返回索引</a>
      <span class="brand">Save the Doge</span>
      <button id="levelsBtn" class="quiet">选关 <span id="levelCount">1 / 5</span></button>
    </header>
    <section class="workspace" aria-label="画线救援游戏">
      <div class="board-wrap">
        <div class="board-stage">
          <canvas id="gameCanvas" width="600" height="1080" aria-label="绘图区：在点阵区域拖动画线，连续点按同一条线两次即可删除。" aria-describedby="statusMessage"></canvas>
          <div class="board-hud">
            <div class="ink-status" role="meter" aria-label="剩余线长" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <svg class="thread-spool" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M19 17C12 19 13 28 3 29" fill="none" stroke="#294b40" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="17" y="5" width="6" height="19" rx="2" fill="#c5a276"/>
                <g class="spool-thread">
                  <rect x="10" y="8" width="20" height="13" rx="4" fill="#527867"/>
                  <path d="M12 11H28M11 14.5H29M12 18H28" stroke="#87a18e" stroke-width="1"/>
                </g>
                <path d="M13 6H27M13 23H27" stroke="#ac8355" stroke-width="3" stroke-linecap="round"/>
                <circle cx="3" cy="29" r="1.4" fill="#294b40"/>
              </svg>
              <span id="inkText">剩余线长 500</span>
            </div>
            <span id="clock" hidden>10.0 秒</span>
          </div>
          <p id="statusMessage" class="board-message" role="status" aria-live="polite"></p>
          <span id="phaseLabel" class="sr-only">准备</span>
        </div>
        <div class="board-controls">
          <button id="primaryAction" class="danger-action" type="button">开始</button>
        </div>
      </div>
    </section>
  </main>
  <div id="spoolCursor" hidden aria-hidden="true"><svg class="thread-spool" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M19 17C12 19 13 28 3 29" fill="none" stroke="#294b40" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="17" y="5" width="6" height="19" rx="2" fill="#c5a276"/>
                <g class="spool-thread">
                  <rect x="10" y="8" width="20" height="13" rx="4" fill="#527867"/>
                  <path d="M12 11H28M11 14.5H29M12 18H28" stroke="#87a18e" stroke-width="1"/>
                </g>
                <path d="M13 6H27M13 23H27" stroke="#ac8355" stroke-width="3" stroke-linecap="round"/>
                <circle cx="3" cy="29" r="1.4" fill="#294b40"/>
              </svg></div>
  <dialog id="levelsDialog" aria-labelledby="levelsTitle">
    <div class="dialog-head"><h2 id="levelsTitle">选择关卡</h2><button id="closeLevelsBtn" aria-label="关闭选关">关闭</button></div>
    <p id="progressText"></p>
    <div id="levelList"></div>
    <button id="bestBtn" class="wide" hidden>载入本关最佳防线</button>
  </dialog>
