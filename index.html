<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/assets/site/shell.css" />
  <title>Ally 索引</title>
  <style>
    body {
      min-height: 100dvh;
    }
    .desc {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .index-card {
      display: block;
      padding: 22px 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--trans), box-shadow var(--trans), background var(--trans), transform var(--trans);
    }
    .index-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      background: #fcfefe;
    }
    .index-card:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    .title {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.2px;
    }
    .meta {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap is-catalog">
    <div id="topNav" class="top-nav"></div>
    <h1 class="page-title">Ally 总索引</h1>
    <p class="desc">统一入口，分别进入应用与文档目录。</p>
    <section class="grid">
      <a class="card index-card" href="./apps/index.html">
        <p class="title">Apps 索引</p>
        <p class="meta">./apps/index.html</p>
      </a>
      <a class="card index-card" href="./docs/index.html">
        <p class="title">Docs 索引</p>
        <p class="meta">./docs/index.html</p>
      </a>
      <a class="card index-card" href="./kids/index.html">
        <p class="title">Kids 索引</p>
        <p class="meta">./kids/index.html</p>
      </a>
      <a class="card index-card" href="./wiki/index.html">
        <p class="title">Wiki 索引</p>
        <p class="meta">./wiki/index.html</p>
      </a>
    </section>
  </main>

  <script src="/assets/site/nav.js"></script>
  <script>
    initTopNav({
      containerEl: document.getElementById("topNav"),
    });
  </script>
</body>
</html>
