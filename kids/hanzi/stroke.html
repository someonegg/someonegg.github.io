<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <title>汉字笔顺</title>
  <style>
    :root {
      --bg: #f4efe4;
      --surface: #fbf7ee;
      --surface-soft: #f7f1e5;
      --text: #2b241d;
      --muted: #6f6255;
      --accent: #6f4b2f;
      --accent-soft: rgba(111, 75, 47, 0.12);
      --assist: #f8eee3;
      --assist-text: #7f2f1d;
      --border: #ddd0bd;
      --stroke-active: #8b4513;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(24, 32, 36, 0.06);
      --focus: 0 0 0 3px rgba(111, 75, 47, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, #fffdf8 0%, #f8f2e8 28%, transparent 72%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
      padding: 16px 14px 28px;
      touch-action: manipulation;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .nav-link:hover { background: var(--accent-soft); }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.3px;
      font-weight: 650;
    }

    .desc {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--surface-soft);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 240px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 12px;
      font-size: 18px;
      background: #fff;
      color: var(--text);
    }

    input[type="text"]:focus-visible,
    button:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      height: 42px;
      padding: 0 14px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      touch-action: manipulation;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #fcfefe;
    }

    .btn-main {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 560;
    }

    .btn-main:hover {
      color: #fff;
      filter: brightness(1.03);
      background: #1a625d;
      border-color: #1a625d;
    }

    #autoplayBtn {
      background: var(--surface-soft);
      border-color: var(--border);
      color: var(--muted);
      min-width: 88px;
    }

    #autoplayBtn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: #f4ebdd;
    }

    #autoplayBtn.is-playing {
      background: var(--stroke-active);
      border-color: var(--stroke-active);
      color: #fff;
    }

    #autoplayBtn.is-playing:hover {
      color: #fff;
      filter: brightness(1.03);
    }

    .content {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(300px, 0.95fr);
      gap: 12px;
    }

    .viewer,
    .info {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .viewer {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 520px;
    }

    .svg-wrap {
      flex: 1 1 auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(124, 96, 67, 0.03), rgba(124, 96, 67, 0.01)),
        repeating-linear-gradient(90deg, rgba(124, 96, 67, 0.015) 0, rgba(124, 96, 67, 0.015) 1px, transparent 1px, transparent 7px),
        #f3e8d2;
      display: grid;
      place-items: center;
      height: auto;
      min-height: 320px;
    }

    svg {
      width: min(100%, 460px);
      height: auto;
      aspect-ratio: 1 / 1;
    }

    .status {
      margin: 0;
      margin-top: auto;
      min-height: 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .status.warn {
      color: #b45309;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 520px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      color: var(--muted);
      background: #fff;
      margin-right: 6px;
    }

    .chip strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .current {
      background: var(--assist);
      color: var(--assist-text);
      border: 1px solid #ffd4bf;
      border-radius: 9px;
      padding: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 980px) {
      body {
        padding: 6px 6px 8px;
        height: 100dvh;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .top-nav { margin-bottom: 4px; }
      h1 { font-size: 20px; line-height: 1.25; }
      .desc { display: none; }
      .panel {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }
      .toolbar {
        padding: 8px;
        gap: 6px;
      }
      .field {
        min-width: 100%;
        gap: 6px;
      }
      .field label { font-size: 12px; }
      .field-hint { font-size: 11px; }
      .content {
        flex: 1;
        min-height: 0;
        padding: 8px;
        gap: 8px;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      .viewer,
      .info {
        min-height: 0;
        padding: 8px;
        gap: 8px;
      }
      .viewer { overflow: hidden; }
      .info { overflow: auto; }
      .svg-wrap {
        height: auto;
        min-height: 260px;
      }
      .status {
        min-height: 20px;
        font-size: 12px;
      }
      .chip {
        font-size: 12px;
        padding: 3px 8px;
      }
      .current {
        padding: 8px;
        font-size: 13px;
      }
      .controls { gap: 6px; }
      button,
      input[type="text"] { height: 40px; }
    }

    @media (max-width: 980px) and (max-height: 760px) {
      .content {
        grid-template-rows: minmax(0, 1fr) auto;
      }
      .svg-wrap {
        height: auto;
        min-height: 220px;
      }
      .current {
        padding: 6px 8px;
        font-size: 12px;
      }
      .controls {
        gap: 4px;
      }
      button,
      input[type="text"] {
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="top-nav">
      <a href="./index.html" class="nav-link">返回索引</a>
    </nav>

    <header>
      <h1>汉字笔顺</h1>
      <p class="desc">输入一个汉字，观察书写过程，学习笔顺。</p>
    </header>

    <section class="panel">
      <div class="toolbar">
        <div class="field">
          <label for="hanziInput">输入汉字</label>
          <input id="hanziInput" type="text" maxlength="8" placeholder="输入一个汉字，按回车" />
          <button id="autoplayBtn" type="button">自动播放</button>
        </div>
      </div>

      <div class="content">
        <section class="viewer">
          <div class="svg-wrap">
            <svg id="strokeSvg" viewBox="0 0 1024 1024" aria-label="笔顺演示区"></svg>
          </div>
          <p id="statusText" class="status">正在加载字库…</p>
        </section>

        <section class="info">
          <div>
            <span class="chip">当前汉字 <strong id="currentChar">-</strong></span>
            <span class="chip">总笔画 <strong id="totalCount">-</strong></span>
          </div>

          <div id="currentStroke" class="current">当前笔画：-</div>

          <div class="controls">
            <button id="prevBtn" type="button">上一步</button>
            <button id="nextBtn" type="button">下一步</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="/vendor/msgpack.min.js"></script>
  <script src="./loader.js"></script>
  <script>
    const inputEl = document.getElementById('hanziInput');
    const svgEl = document.getElementById('strokeSvg');
    const statusText = document.getElementById('statusText');
    const currentCharEl = document.getElementById('currentChar');
    const totalCountEl = document.getElementById('totalCount');
    const currentStrokeEl = document.getElementById('currentStroke');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const autoplayBtn = document.getElementById('autoplayBtn');

    const SHARD_COUNT = 8;
    const SHARD_CONCURRENCY = 2;
    const FETCH_TIMEOUT_MS = 60000;
    const MAX_RETRIES = 2;

    let dict = null;
    let dictReady = false;
    let activeChar = '';
    let activeData = null;
    let activeLayout = null;
    let strokeScene = null;
    let phase = 0;

    function restoreStrokePayload(payload) {
      const out = {};
      for (const [ch, item] of Object.entries(payload)) {
        out[ch] = {
          total: item && typeof item === 'object' ? item.a : undefined,
          strokes: item && typeof item === 'object' ? item.b : undefined,
          paths: item && typeof item === 'object' ? item.c : undefined,
          medians: item && typeof item === 'object' ? item.d : undefined
        };
      }
      return out;
    }

    const playback = {
      mode: 'idle', // idle | manual | auto
      running: false,
      rafId: null,
      stage: 'idle',
      strokeIndex: -1,
      doneCount: 0,
      progress: 0,
      transitionProgress: 0,
      transitionFrom: -1,
      transitionTo: -1,
      stageStartTs: 0,
      stageDurationMs: 0,
    };

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const RENDER_BOX = { width: 1024, height: 900 };
    const ADAPTIVE_CONFIG = {
      marginRatioX: 0.04,
      marginRatioY: 0.06,
      minScaleByCount: 0.78,
      maxScaleByCount: 1.0,
      scaleSlope: 0.012,
      scaleIntercept: 1.06,
    };
    const ANIMATION_CONFIG = {
      minStrokeMs: 350,
      baseStrokeMs: 180,
      maxStrokeMs: 1100,
      strokeMsPerUnit: 1.05,
    };
    const STROKE_COLOR = {
      done: '#2a231b',
      pending: '#bcae99',
    };

    function updateAutoplayButton() {
      const isPlaying = Boolean(playback.running && playback.mode === 'auto' && activeData);
      autoplayBtn.classList.toggle('is-playing', isPlaying);

      if (!activeData) {
        autoplayBtn.textContent = '自动播放';
        return;
      }

      const maxPhase = activeData.total + 1;
      if (playback.running && playback.mode === 'manual') {
        autoplayBtn.textContent = '自动播放';
      } else if (isPlaying) {
        autoplayBtn.textContent = '暂停';
      } else if (playback.mode === 'auto' && (playback.stage === 'drawing' || playback.stage === 'transition')) {
        autoplayBtn.textContent = '继续播放';
      } else if (phase >= maxPhase) {
        autoplayBtn.textContent = '重新播放';
      } else if (phase > 0) {
        autoplayBtn.textContent = '继续播放';
      } else {
        autoplayBtn.textContent = '自动播放';
      }
    }

    function isSingleCjk(text) {
      const chars = Array.from(text.trim());
      if (chars.length !== 1) return false;
      return /[\u3400-\u9FFF\uF900-\uFAFF]/u.test(chars[0]);
    }

    function setStatus(message, type = 'normal') {
      statusText.textContent = message;
      statusText.className = type === 'warn' ? 'status warn' : 'status';
    }

    function cancelPlaybackRaf() {
      if (playback.rafId) {
        window.cancelAnimationFrame(playback.rafId);
      }
      playback.rafId = null;
    }

    function stopPlay() {
      cancelPlaybackRaf();
      playback.running = false;
      updateAutoplayButton();
    }

    function clamp(min, value, max) {
      return Math.max(min, Math.min(value, max));
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function buildMedianRuntime(points) {
      if (!Array.isArray(points) || points.length < 2) return null;
      const safePoints = points
        .filter((pt) => Array.isArray(pt) && pt.length >= 2 && Number.isFinite(pt[0]) && Number.isFinite(pt[1]))
        .map((pt) => [Number(pt[0]), Number(pt[1])])
        .filter((pt, i, all) => i === 0 || pt[0] !== all[i - 1][0] || pt[1] !== all[i - 1][1]);
      if (safePoints.length < 2) return null;

      const pathParts = [`M ${safePoints[0][0]} ${safePoints[0][1]}`];
      const cumulative = [0];
      let totalLen = 0;
      for (let i = 1; i < safePoints.length; i += 1) {
        const [x1, y1] = safePoints[i - 1];
        const [x2, y2] = safePoints[i];
        const segLen = Math.hypot(x2 - x1, y2 - y1);
        if (!Number.isFinite(segLen) || segLen === 0) continue;
        totalLen += segLen;
        cumulative.push(totalLen);
        pathParts.push(`L ${x2} ${y2}`);
      }

      if (totalLen <= 0 || pathParts.length < 2 || cumulative.length < 2) return null;
      return {
        pathD: pathParts.join(' '),
        points: safePoints,
        cumulative,
        length: totalLen,
        start: safePoints[0],
        end: safePoints[safePoints.length - 1],
      };
    }

    function getStrokeRuntime(data, index) {
      if (!data || !Array.isArray(data.__strokeRuntime)) return null;
      return data.__strokeRuntime[index] || null;
    }

    function ensureStrokeRuntime(data) {
      if (!data) return;
      if (Array.isArray(data.__strokeRuntime)) return;
      const total = Math.max(1, Number(data.total) || (Array.isArray(data.paths) ? data.paths.length : 1));
      const medians = Array.isArray(data.medians) ? data.medians : [];
      data.__strokeRuntime = new Array(total).fill(null).map((_, idx) => buildMedianRuntime(medians[idx]));
      data.__strokeRuntime.forEach((runtime, idx) => prepareWritingRuntime(runtime, data.strokes[idx]));
    }

    function getStrokeDurationMs(index) {
      const runtime = getStrokeRuntime(activeData, index);
      return runtime ? runtime.duration : 350;
    }

    function getManualDurationMs(index) {
      return getStrokeDurationMs(index);
    }

    function resetPlaybackState(doneCount = 0) {
      cancelPlaybackRaf();
      playback.mode = 'idle';
      playback.running = false;
      playback.stage = 'idle';
      playback.strokeIndex = -1;
      playback.doneCount = Math.max(0, Number(doneCount) || 0);
      playback.progress = 0;
      playback.transitionProgress = 0;
      playback.transitionFrom = -1;
      playback.transitionTo = -1;
      playback.stageStartTs = 0;
      playback.stageDurationMs = 0;
    }

    function syncPlaybackToPhase() {
      if (!activeData) {
        resetPlaybackState(0);
        return;
      }
      const total = activeData.total;
      if (phase <= 0) {
        phase = 0;
        playback.doneCount = 0;
        playback.stage = 'idle';
        playback.strokeIndex = -1;
      } else if (phase >= total + 1) {
        phase = total + 1;
        playback.doneCount = total;
        playback.stage = 'finished';
        playback.strokeIndex = -1;
      } else {
        playback.doneCount = phase - 1;
        playback.stage = 'idle';
        playback.strokeIndex = phase - 1;
      }
      playback.mode = 'idle';
      playback.running = false;
      playback.progress = 0;
      playback.transitionProgress = 0;
      playback.transitionFrom = -1;
      playback.transitionTo = -1;
      playback.stageStartTs = 0;
      playback.stageDurationMs = 0;
      cancelPlaybackRaf();
    }

    function startDrawingStage(index, mode, ts = 0, startProgress = 0) {
      if (!activeData) return;
      const total = activeData.total;
      const strokeIndex = clamp(0, index, Math.max(0, total - 1));
      playback.mode = mode;
      playback.stage = 'drawing';
      playback.strokeIndex = strokeIndex;
      playback.doneCount = Math.min(playback.doneCount, strokeIndex);
      playback.progress = clamp(0, startProgress, 1);
      playback.transitionProgress = 0;
      playback.transitionFrom = -1;
      playback.transitionTo = -1;
      playback.stageDurationMs = mode === 'manual' ? getManualDurationMs(strokeIndex) : getStrokeDurationMs(strokeIndex);
      playback.stageStartTs = ts > 0 ? ts - playback.progress * playback.stageDurationMs : 0;
      phase = index + 1;
    }

    function startTransitionStage(from, to, ts = 0) {
      playback.mode = 'auto';
      playback.stage = 'transition';
      playback.strokeIndex = to;
      playback.transitionFrom = from;
      playback.transitionTo = to;
      playback.transitionProgress = 0;
      playback.progress = 0;
      playback.stageStartTs = ts;
      const fromRuntime = getStrokeRuntime(activeData, from);
      const toRuntime = getStrokeRuntime(activeData, to);
      const distance = fromRuntime && toRuntime
        ? Math.hypot(toRuntime.start[0] - fromRuntime.end[0], toRuntime.start[1] - fromRuntime.end[1]) : 200;
      playback.stageDurationMs = clamp(90, 85 + distance * 0.13, 180);
      phase = from + 1;
    }

    function startManualStrokeAnimation(index) {
      if (!activeData || index < 0 || index >= activeData.total) return;
      stopPlay();
      playback.doneCount = index;
      playback.running = true;
      startDrawingStage(index, 'manual');
      playback.rafId = window.requestAnimationFrame(animationTick);
      updateAutoplayButton();
    }

    function animationTick(ts) {
      if (!playback.running || !activeData) {
        stopPlay();
        renderAll();
        return;
      }

      const total = activeData.total;
      const previousStage = playback.stage;
      const previousStroke = playback.strokeIndex;
      if (playback.stageStartTs === 0) {
        if (playback.stage === 'drawing') {
          playback.stageStartTs = ts - playback.progress * Math.max(1, playback.stageDurationMs);
        } else if (playback.stage === 'transition') {
          playback.stageStartTs = ts - playback.transitionProgress * Math.max(1, playback.stageDurationMs);
        } else {
          playback.stageStartTs = ts;
        }
      }
      const elapsed = ts - playback.stageStartTs;
      const rawP = clamp(0, elapsed / Math.max(1, playback.stageDurationMs), 1);

      if (playback.stage === 'drawing') {
        playback.progress = rawP;
        if (rawP >= 1) {
          playback.doneCount = Math.min(total, playback.strokeIndex + 1);
          playback.progress = 0;
          if (playback.mode === 'manual') {
            playback.running = false;
            playback.stage = 'finished';
            cancelPlaybackRaf();
            renderAll();
            updateAutoplayButton();
            return;
          }
          if (playback.doneCount >= total) {
            playback.running = false;
            playback.mode = 'auto';
            playback.stage = 'finished';
            playback.strokeIndex = -1;
            phase = total + 1;
            cancelPlaybackRaf();
            renderAll();
            updateAutoplayButton();
            return;
          }
          startTransitionStage(playback.strokeIndex, playback.strokeIndex + 1, ts);
        }
      } else if (playback.stage === 'transition') {
        playback.transitionProgress = rawP;
        if (rawP >= 1) {
          playback.transitionProgress = 0;
          startDrawingStage(playback.doneCount, 'auto', ts, 0);
        }
      }

      if (previousStage !== playback.stage || previousStroke !== playback.strokeIndex) renderAll();
      else renderSVG();
      playback.rafId = window.requestAnimationFrame(animationTick);
    }

    function startPlay() {
      if (!activeData) {
        updateAutoplayButton();
        return;
      }

      const total = Math.max(1, activeData.total || 1);
      if (playback.running) {
        if (playback.mode === 'auto') {
          stopPlay();
          return;
        }
        if (playback.mode === 'manual') {
          playback.mode = 'auto';
          if (playback.stage === 'drawing' && playback.strokeIndex >= 0) {
            playback.stageDurationMs = getStrokeDurationMs(playback.strokeIndex);
          }
          playback.stageStartTs = 0;
          updateAutoplayButton();
          return;
        }
      }

      if (phase >= total + 1) {
        phase = 0;
        resetPlaybackState(0);
      }

      if (playback.mode === 'auto' && (playback.stage === 'drawing' || playback.stage === 'transition')) {
        playback.running = true;
        playback.stageStartTs = 0;
        playback.rafId = window.requestAnimationFrame(animationTick);
        updateAutoplayButton();
        return;
      }

      playback.mode = 'auto';
      playback.running = true;
      playback.doneCount = clamp(0, phase - 1, total);
      if (playback.doneCount >= total) {
        phase = total + 1;
        playback.running = false;
        playback.stage = 'finished';
        updateAutoplayButton();
        return;
      }

      startDrawingStage(playback.doneCount, 'auto');
      renderAll();
      playback.rafId = window.requestAnimationFrame(animationTick);
    }

    function setButtonsDisabled(disabled) {
      prevBtn.disabled = disabled;
      nextBtn.disabled = disabled;
      autoplayBtn.disabled = disabled;
      updateAutoplayButton();
    }

    function computeAdaptiveStyle(data, renderedBounds) {
      const totalStrokes = Math.max(1, Number(data.total) || (Array.isArray(data.paths) ? data.paths.length : 1));
      const bbox = renderedBounds || { minX: 0, minY: 0, maxX: RENDER_BOX.width, maxY: RENDER_BOX.height };
      const bboxW = Math.max(1, bbox.maxX - bbox.minX);
      const bboxH = Math.max(1, bbox.maxY - bbox.minY);

      const availW = RENDER_BOX.width * (1 - ADAPTIVE_CONFIG.marginRatioX * 2);
      const availH = RENDER_BOX.height * (1 - ADAPTIVE_CONFIG.marginRatioY * 2);
      const fitScale = Math.min(1, availW / bboxW, availH / bboxH);
      const countScale = clamp(
        ADAPTIVE_CONFIG.minScaleByCount,
        ADAPTIVE_CONFIG.scaleIntercept - ADAPTIVE_CONFIG.scaleSlope * totalStrokes,
        ADAPTIVE_CONFIG.maxScaleByCount
      );
      const scaleFinal = fitScale * countScale;

      const charCx = (bbox.minX + bbox.maxX) / 2;
      const charCy = (bbox.minY + bbox.maxY) / 2;
      const viewCx = RENDER_BOX.width / 2;
      const viewCy = RENDER_BOX.height / 2;
      const shiftX = viewCx - charCx;
      const shiftY = viewCy - charCy;

      return { scaleFinal, charCx, charCy, shiftX, shiftY };
    }

    function computeVisualState(total) {
      const state = {
        doneCount: 0,
        currentIndex: -1,
        drawProgress: 0,
        transitionFrom: -1,
        transitionTo: -1,
        transitionProgress: 0,
      };

      if (playback.stage === 'drawing' && playback.strokeIndex >= 0) {
        state.doneCount = clamp(0, playback.doneCount, total);
        state.currentIndex = playback.strokeIndex;
        state.drawProgress = clamp(0, playback.progress, 1);
        return state;
      }

      if (playback.stage === 'transition') {
        state.doneCount = clamp(0, playback.doneCount, total);
        state.currentIndex = playback.doneCount < total ? playback.doneCount : -1;
        state.transitionFrom = playback.transitionFrom;
        state.transitionTo = playback.transitionTo;
        state.transitionProgress = easeOutCubic(clamp(0, playback.transitionProgress, 1));
        return state;
      }

      if (playback.stage === 'finished') {
        state.doneCount = clamp(0, playback.doneCount, total);
        state.currentIndex = phase >= 1 && phase <= total ? phase - 1 : -1;
        return state;
      }

      state.doneCount = Math.max(0, Math.min(phase - 1, total));
      state.currentIndex = phase >= 1 && phase <= total ? phase - 1 : -1;
      return state;
    }

    function svgNode(tag, attrs = {}) {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
      return node;
    }

    function smoothStep(value) {
      const t = clamp(0, value, 1);
      return t * t * (3 - 2 * t);
    }

    function sampleMedian(runtime, distance) {
      let segment = 1;
      while (segment < runtime.cumulative.length - 1 && runtime.cumulative[segment] < distance) segment += 1;
      const a = runtime.points[segment - 1], b = runtime.points[segment];
      const ratio = clamp(0, (distance - runtime.cumulative[segment - 1]) /
        (runtime.cumulative[segment] - runtime.cumulative[segment - 1]), 1);
      return { x: a[0] + (b[0] - a[0]) * ratio, y: a[1] + (b[1] - a[1]) * ratio };
    }

    function writingPressure(kind, p) {
      const entry = 0.22 * Math.exp(-p / 0.12);
      if (kind === '点') return 0.42 + 0.58 * Math.sin(Math.PI * Math.pow(p, 0.7) * 0.85);
      if (kind === '捺') return p < 0.76
        ? 0.42 + 0.58 * smoothStep(p / 0.76)
        : 1 - 0.85 * smoothStep((p - 0.76) / 0.24);
      if (kind === '撇' || kind === '提') return 0.88 - 0.73 * Math.pow(p, kind === '提' ? 0.8 : 1.5);
      if (kind === '钩') return 0.7 + entry + 0.25 * Math.exp(-Math.pow((p - 0.82) / 0.1, 2))
        - 0.58 * smoothStep((p - 0.88) / 0.12);
      return 0.67 + entry + 0.3 * smoothStep((p - 0.78) / 0.22);
    }

    // The trajectory and its deposition stamps are deterministic. Frames consume
    // the same stamps whether playback runs at 120 Hz, 30 Hz, or skips a frame.
    function prepareWritingRuntime(runtime, name = '') {
      if (!runtime || runtime.stamps) return;
      const kind = /[撇捺提钩点]$/.exec(name)?.[0] || '横竖';
      const count = Math.max(2, Math.ceil(runtime.length / 3));
      const samples = Array.from({ length: count + 1 }, (_, i) => {
        const p = i / count;
        return { ...sampleMedian(runtime, runtime.length * p), p, pressure: writingPressure(kind, p) };
      });
      samples.forEach((sample, i) => {
        const before = samples[Math.max(0, i - 2)], after = samples[Math.min(count, i + 2)];
        sample.angle = Math.atan2(after.y - before.y, after.x - before.x);
      });

      const corners = new Map();
      if (/折|钩/.test(name)) {
        for (let i = 1; i < runtime.points.length - 1; i += 1) {
          const a = runtime.points[i - 1], b = runtime.points[i], c = runtime.points[i + 1];
          const cosine = ((b[0] - a[0]) * (c[0] - b[0]) + (b[1] - a[1]) * (c[1] - b[1])) /
            (Math.hypot(b[0] - a[0], b[1] - a[1]) * Math.hypot(c[0] - b[0], c[1] - b[1]));
          const index = Math.round(runtime.cumulative[i] / runtime.length * count);
          if (cosine < 0.55 && index > 3 && index < count - 2 &&
              [...corners.keys()].every((other) => Math.abs(other - index) * runtime.length / count > 35)) {
            corners.set(index, clamp(40, 42 + (1 - cosine) * 18, 75));
          }
        }
      }

      const cost = [0];
      for (let i = 1; i <= count; i += 1) {
        const p = i / count;
        let speed = 0.55 + 1.65 * smoothStep(p / 0.28);
        if (kind === '点') speed = 0.9 + 0.5 * Math.cos(p * Math.PI);
        else if (kind === '捺') speed *= 1 - 0.6 * Math.exp(-Math.pow((p - 0.72) / 0.15, 2));
        if (/撇|捺|提|钩/.test(kind)) speed += 1.8 * smoothStep((p - 0.8) / 0.2);
        else speed *= 1 - 0.7 * smoothStep((p - 0.8) / 0.2);
        cost.push(cost[i - 1] + 1 / speed);
      }
      const baseMs = clamp(ANIMATION_CONFIG.minStrokeMs,
        ANIMATION_CONFIG.baseStrokeMs + runtime.length * ANIMATION_CONFIG.strokeMsPerUnit,
        ANIMATION_CONFIG.maxStrokeMs);
      const entryMs = kind === '点' ? 65 : 48;
      const exitMs = kind === '横竖' || kind === '点' ? 30 : 0;
      const stamps = [];
      for (let i = 1; i <= 8; i += 1) {
        stamps.push({ index: 0, scale: 0.1 + 0.9 * smoothStep(i / 8), at: entryMs * i / 8 });
      }
      let holds = 0;
      for (let i = 1; i <= count; i += 1) {
        const at = entryMs + cost[i] / cost[count] * (baseMs - entryMs - exitMs) + holds;
        const hold = corners.get(i) || (i === count ? exitMs : 0);
        if (hold) {
          // The footprint widens while the centre barely moves at a turn.
          for (let j = 0; j <= 5; j += 1) {
            stamps.push({ index: i, scale: 0.7 + 0.3 * smoothStep(j / 5), at: at + hold * j / 5 });
          }
          holds += i === count ? 0 : hold;
          samples[i].pressure = Math.max(samples[i].pressure, 0.96);
        } else stamps.push({ index: i, scale: 1, at });
      }
      const duration = Math.min(1400, baseMs + holds);
      const lastTime = stamps[stamps.length - 1].at;
      // The final deposited footprint precedes the boundary by only 2 ms.
      stamps.forEach((stamp) => { stamp.at = stamp.at / lastTime * (duration - 2) / duration; });
      runtime.samples = samples;
      runtime.stamps = stamps;
      runtime.duration = duration;
      runtime.kind = kind;
    }

    function releaseStrokeScene() {
      if (!strokeScene) return;
      for (const stroke of strokeScene.strokes) {
        if (stroke.brush) stroke.brush.canvas.width = stroke.brush.canvas.height = 0;
      }
      strokeScene = null;
    }

    // Raster ownership follows the median, but deposition is made by overlapping
    // ellipses, not by revealing transverse strips. Ownership only guards against
    // touching a later section of a tight hook with the side of a wide footprint.
    function prepareBrush(stroke, runtime) {
      const b = stroke.pending.getBBox();
      const x = Math.floor(b.x) - 2, y = Math.floor(b.y) - 2;
      const width = Math.ceil(b.x + b.width) - x + 2;
      const height = Math.ceil(b.y + b.height) - y + 2;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.translate(-x, -y);
      context.fill(new Path2D(stroke.pending.getAttribute('d')));
      context.resetTransform();
      const silhouette = context.getImageData(0, 0, width, height);
      const pixels = context.createImageData(width, height);
      const owners = new Int16Array(width * height).fill(-1);
      const samples = runtime.samples.map((sample) => ({
        ...sample, rx: 3, ry: 3, cos: Math.cos(sample.angle), sin: Math.sin(sample.angle),
      }));
      const count = samples.length - 1;
      for (let py = 0; py < height; py += 1) {
        for (let px = 0; px < width; px += 1) {
          const pixel = py * width + px;
          if (!silhouette.data[pixel * 4 + 3]) continue;
          const gx = x + px + 0.5, gy = y + py + 0.5;
          let nearest = Infinity, position = 0;
          for (let i = 1; i < runtime.points.length; i += 1) {
            const a = runtime.points[i - 1], b = runtime.points[i];
            const dx = b[0] - a[0], dy = b[1] - a[1];
            const ratio = clamp(0, ((gx - a[0]) * dx + (gy - a[1]) * dy) / (dx * dx + dy * dy), 1);
            const distance = (gx - a[0] - ratio * dx) ** 2 + (gy - a[1] - ratio * dy) ** 2;
            if (distance < nearest) {
              nearest = distance;
              position = runtime.cumulative[i - 1] + ratio * (runtime.cumulative[i] - runtime.cumulative[i - 1]);
            }
          }
          const owner = Math.round(position / runtime.length * count);
          const sample = samples[owner];
          owners[pixel] = owner;
          const dx = gx - sample.x, dy = gy - sample.y;
          // sqrt(2) encloses the full local cross-section in an ellipse.
          // Coverage is established here, never patched by a final whole-stroke fill.
          sample.rx = Math.max(sample.rx, Math.abs(dx * sample.cos + dy * sample.sin) * Math.SQRT2 + 1);
          sample.ry = Math.max(sample.ry, Math.abs(-dx * sample.sin + dy * sample.cos) * Math.SQRT2 + 1);
          pixels.data[pixel * 4] = pixels.data[pixel * 4 + 1] = pixels.data[pixel * 4 + 2] = 255;
        }
      }
      // Smooth the contact envelope and let pressure change its length/width
      // ratio. All changes expand the guaranteed local coverage, never shrink it.
      const radii = samples.map((sample) => sample.ry);
      samples.forEach((sample, i) => {
        sample.ry = Math.max(sample.ry, ...radii.slice(Math.max(0, i - 2), i + 3));
        sample.rx = Math.max(sample.rx, sample.ry * (0.45 + 0.4 * sample.pressure));
        sample.window = Math.max(3, Math.ceil(sample.rx / runtime.length * count));
      });
      context.clearRect(0, 0, width, height);
      stroke.mask.setAttribute('x', String(x));
      stroke.mask.setAttribute('y', String(y));
      stroke.mask.setAttribute('width', String(width));
      stroke.mask.setAttribute('height', String(height));
      for (const [key, value] of Object.entries({ x, y, width, height })) stroke.maskImage.setAttribute(key, String(value));
      stroke.brush = { x, y, width, height, canvas, context, pixels, owners, samples, next: 0, lastTime: -1 };
      return stroke.brush;
    }

    function depositStamp(brush, stamp) {
      const sample = brush.samples[stamp.index];
      const rx = sample.rx * stamp.scale, ry = sample.ry * stamp.scale;
      const cx = sample.x - brush.x, cy = sample.y - brush.y;
      const extentX = Math.abs(sample.cos * rx) + Math.abs(sample.sin * ry);
      const extentY = Math.abs(sample.sin * rx) + Math.abs(sample.cos * ry);
      const left = Math.max(0, Math.floor(cx - extentX)), right = Math.min(brush.width - 1, Math.ceil(cx + extentX));
      const top = Math.max(0, Math.floor(cy - extentY)), bottom = Math.min(brush.height - 1, Math.ceil(cy + extentY));
      for (let y = top; y <= bottom; y += 1) {
        for (let x = left; x <= right; x += 1) {
          const pixel = y * brush.width + x;
          const owner = brush.owners[pixel];
          if (owner < 0 || Math.abs(owner - stamp.index) > sample.window) continue;
          const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
          const along = (dx * sample.cos + dy * sample.sin) / rx;
          const across = (-dx * sample.sin + dy * sample.cos) / ry;
          const radius = Math.sqrt(along * along + across * across);
          if (radius > 1) continue;
          const edge = clamp(0, (1 - radius) * Math.min(rx, ry) + 0.5, 1);
          const pressure = brush.samples[owner].pressure;
          const density = 0.88 + 0.12 * clamp(0, pressure, 1);
          const offset = pixel * 4 + 3;
          brush.pixels.data[offset] = Math.max(brush.pixels.data[offset], Math.round(255 * density * edge));
        }
      }
    }

    function renderBrush(stroke, runtime, time) {
      const brush = stroke.brush || prepareBrush(stroke, runtime);
      if (time === brush.lastTime) return;
      let dirty = brush.lastTime < 0;
      if (time < brush.lastTime) {
        for (let i = 3; i < brush.pixels.data.length; i += 4) brush.pixels.data[i] = 0;
        brush.next = 0;
        dirty = true;
      }
      while (brush.next < runtime.stamps.length && runtime.stamps[brush.next].at <= time) {
        depositStamp(brush, runtime.stamps[brush.next]);
        brush.next += 1;
        dirty = true;
      }
      brush.lastTime = time;
      if (!dirty) return;
      brush.context.putImageData(brush.pixels, 0, 0);
      stroke.maskImage.setAttribute('href', brush.canvas.toDataURL());
    }

    function createStrokeScene() {
      releaseStrokeScene();
      svgEl.replaceChildren();
      const fit = svgNode('g');
      const raw = svgNode('g', { transform: `scale(1, -1) translate(0, -${RENDER_BOX.height})` });
      fit.appendChild(raw);
      svgEl.appendChild(fit);
      const defs = svgNode('defs'), guides = svgNode('g'), inkLayer = svgNode('g');
      raw.append(defs, guides, inkLayer);
      const strokes = activeData.paths.map((d, index) => {
        const pending = svgNode('path', { d, fill: STROKE_COLOR.pending });
        const ink = svgNode('path', { d, fill: STROKE_COLOR.done, visibility: 'hidden' });
        const maskId = `writing-mask-${index}`;
        const mask = svgNode('mask', {
          id: maskId, maskUnits: 'userSpaceOnUse', maskContentUnits: 'userSpaceOnUse',
          style: 'mask-type: alpha',
        });
        const maskImage = svgNode('image', { preserveAspectRatio: 'none' });
        mask.appendChild(maskImage);
        defs.appendChild(mask);
        guides.appendChild(pending);
        inkLayer.appendChild(ink);
        return { pending, ink, mask, maskImage, maskId, brush: null };
      });
      const b = guides.getBBox();
      const adaptive = computeAdaptiveStyle(activeData, {
        minX: b.x, minY: b.y, maxX: b.x + b.width, maxY: b.y + b.height,
      });
      activeLayout = `translate(${adaptive.shiftX} ${adaptive.shiftY}) translate(${adaptive.charCx} ${adaptive.charCy}) scale(${adaptive.scaleFinal}) translate(${-adaptive.charCx} ${-adaptive.charCy})`;
      fit.setAttribute('transform', activeLayout);
      strokeScene = { data: activeData, fit, strokes };
    }

    function renderSVG() {
      if (!activeData) return;
      if (!strokeScene || strokeScene.data !== activeData || !strokeScene.fit.isConnected) createStrokeScene();
      const visual = computeVisualState(activeData.paths.length);
      const drawing = playback.stage === 'drawing';
      strokeScene.strokes.forEach((stroke, i) => {
        const current = drawing && i === visual.currentIndex;
        const done = i < visual.doneCount;
        stroke.ink.setAttribute('visibility', done || current ? 'visible' : 'hidden');
        if (!done && !current) return;
        const runtime = getStrokeRuntime(activeData, i);
        if (!runtime || reducedMotion.matches) {
          stroke.ink.removeAttribute('mask');
          stroke.ink.setAttribute('opacity', String(done ? 1 : Math.min(1, visual.drawProgress / 0.85)));
          return;
        }
        stroke.ink.setAttribute('opacity', '1');
        stroke.ink.setAttribute('mask', `url(#${stroke.maskId})`);
        // Finished strokes keep the exact same deposited ink, including density.
        renderBrush(stroke, runtime, done ? 1 : visual.drawProgress);
      });
    }
    function renderAll() {
      if (!activeData) {
        releaseStrokeScene();
        currentCharEl.textContent = '-';
        totalCountEl.textContent = '-';
        currentStrokeEl.textContent = '当前笔画：-';
        svgEl.innerHTML = '';
        setButtonsDisabled(true);
        return;
      }

      setButtonsDisabled(false);
      const total = activeData.total;
      const maxPhase = total + 1;

      currentCharEl.textContent = activeChar;
      totalCountEl.textContent = String(total);
      if (phase === 0) {
        currentStrokeEl.textContent = `准备开始，共 ${total} 笔`;
      } else if (phase >= maxPhase) {
        currentStrokeEl.textContent = `书写完成，共 ${total} 笔`;
      } else {
        const currentName = activeData.strokes[phase - 1] || '-';
        currentStrokeEl.textContent = `第 ${phase} / ${total} 笔：${currentName}`;
      }

      prevBtn.disabled = false;
      nextBtn.disabled = false;

      renderSVG();
      updateAutoplayButton();
    }

    function queryChar(raw) {
      stopPlay();

      if (!dictReady) {
        setStatus('正在加载字库，请稍候。', 'warn');
        return;
      }

      const text = raw.trim();
      if (!isSingleCjk(text)) {
        activeChar = '';
        activeData = null;
        resetPlaybackState(0);
        activeLayout = null;
        renderAll();
        setStatus('请只输入一个汉字。', 'warn');
        return;
      }

      const ch = Array.from(text)[0];
      const item = dict && dict[ch];

      if (!item) {
        activeChar = ch;
        activeData = null;
        resetPlaybackState(0);
        activeLayout = null;
        renderAll();
        setStatus(`暂未收录“${ch}”，换一个字试试。`, 'warn');
        return;
      }

      activeChar = ch;
      activeData = item;
      ensureStrokeRuntime(activeData);
      resetPlaybackState(0);
      activeLayout = null;
      phase = 0;
      renderAll();
      setStatus(`可逐笔查看，也可自动播放。`);
    }

    async function loadDict() {
      try {
        const loader = window.HanziDataLoader;
        if (!loader) throw new Error('HanziDataLoader 不可用');
        dict = await loader.loadShardedMap({
          dir: 'stroke',
          baseName: 'char-stroke',
          shardCount: SHARD_COUNT,
          concurrency: SHARD_CONCURRENCY,
          timeoutMs: FETCH_TIMEOUT_MS,
          retries: MAX_RETRIES,
          restore: restoreStrokePayload,
          onProgress: ({ loadedCount, shardCount }) => {
            setStatus(`正在加载字库（${loadedCount}/${shardCount}）…`);
          }
        });
        dictReady = true;
        setStatus(`字库已加载，可以开始查询。`);
      } catch (err) {
        dict = null;
        dictReady = false;
        setStatus('字库加载失败，请刷新重试。', 'warn');
      }
    }

    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') queryChar(inputEl.value);
    });

    autoplayBtn.addEventListener('click', () => {
      if (!activeData) return;
      startPlay();
    });

    prevBtn.addEventListener('click', () => {
      if (!activeData) return;
      stopPlay();
      const total = activeData.total;
      if (phase <= 0) {
        phase = total + 1;
      } else {
        phase = phase - 1;
      }
      if (phase >= 1 && phase <= total) {
        startManualStrokeAnimation(phase - 1);
      } else {
        syncPlaybackToPhase();
      }
      renderAll();
    });

    nextBtn.addEventListener('click', () => {
      if (!activeData) return;
      stopPlay();
      const total = activeData.total;
      if (phase >= total + 1) {
        phase = 0;
      } else {
        phase = Math.max(1, phase + 1);
      }
      if (phase >= 1 && phase <= total) {
        startManualStrokeAnimation(phase - 1);
      } else {
        syncPlaybackToPhase();
      }
      renderAll();
    });

    setButtonsDisabled(true);
    (async () => {
      await loadDict();
      if (!dict) return;
      const param = new URLSearchParams(location.search).get('char');
      if (param && param.trim()) {
        inputEl.value = param.trim();
        queryChar(param.trim());
      }
    })();
  </script>
</body>
</html>
