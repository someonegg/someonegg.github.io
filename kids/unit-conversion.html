<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单位换算：铺一面，叠一层</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="shared/lesson.css" />
    <script src="shared/math.js" defer></script>
    <script src="shared/player.js" defer></script>
    <script src="shared/scenes.js" defer></script>
    <script src="shared/app.js" defer></script>
  </head>
  <body data-lesson="units">
    <main>
      <a class="back" href="index.html">返回索引</a>
      <header>
        <h1 id="title">单位换算：铺一面，叠一层</h1>
        <p id="intro"></p>
      </header>
      <form
        id="settings"
        class="settings"
        aria-label="选择例题"
        novalidate
      ></form>
      <p id="settings-status" class="settings-status" role="status"></p>
      <p id="error" class="error" role="alert"></p>
      <section class="workspace" aria-label="分步教学演示">
        <div class="visual-column">
          <div
            id="stage-scroll"
            class="stage-scroll"
            tabindex="0"
            role="region"
            aria-label="演示图，长图可左右滚动"
          >
            <div id="stage" class="stage"></div>
          </div>
          <div id="readout" class="readout"></div>
          <div class="transport" role="group" aria-label="动画播放控制">
            <button id="previous" type="button">上一步</button>
            <button id="next" type="button" class="primary">下一步</button>
            <button id="play" type="button">播放</button>
            <label
              >速度<select id="speed">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="1.5">1.5×</option>
              </select></label
            >
          </div>
          <p id="legend" class="legend"></p>
        </div>
        <aside class="explanation" aria-label="当前步骤讲解">
          <span id="step-count" class="step-count"></span>
          <h2 id="step-title"></h2>
          <p id="step-body"></p>
          <ol id="steps" class="steps"></ol>
        </aside>
      </section>
      <footer>
        一起观察：先说说你发现了什么，再点下一步。随时暂停，也可以回到上一步重看。
      </footer>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
      <noscript>请启用 JavaScript，使用分步演示。</noscript>
    </main>
  </body>
</html>
